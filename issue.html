<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue Type — Whack the PCLL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%231e3a5f'/><g transform='translate(1.9 1.9) scale(0.84)' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M5 19 12.5 11.5'/><rect x='9' y='8' width='10' height='4.2' rx='1.2' transform='rotate(45 14 10.1)'/></g></svg>" />
  <!-- Quire Sans is self-hosted (fonts/*.woff2, see the @font-face block at
       the top of styles.css) -- preloading the Regular weight, the one
       every page uses for body text, gets it fetching in parallel with the
       stylesheet instead of waiting to be discovered inside it. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/QuireSans.woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script src="common-core.js"></script>
  <script src="common-content.js"></script>
  <script src="common-session.js"></script>
  <!-- Course metadata and deadlines only (826 bytes gzipped). The notes
       themselves are fetched by the pages that show them, for the one
       course they show -- see loadCourseDetails in common-core.js.
       Generated: npm run build:index. -->
  <script src="courseIndex.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <a id="backLink" href="session.html" class="icon-btn back-link" aria-label="Back to session"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <!-- The SESSION heading, matching what session.html's own header shows
           for the same session -- the issue type's own (often long) title
           lives in the body as the page's real subject; see #issueTitle
           below. -->
      <h1 id="issueSessionTitle">Session</h1>
    </div>
    <span class="topbar-brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="brand-hammer"><path d="M5 19 12.5 11.5"/><rect x="9" y="8" width="10" height="4.2" rx="1.2" transform="rotate(45 14 10.1)"/></g><g class="brand-spark" stroke-width="1.5"><path d="M20.4 14.9 21.7 13.5"/><path d="M21.5 17.7 23.3 17.6"/><path d="M20.6 20.4 21.9 21.8"/></g></svg><span class="brand-text">Whack the PCLL</span></span>
    <div class="topbar-controls">
      <button id="printBtn" class="icon-btn" title="Print or save these notes as PDF" aria-label="Print or save these notes as PDF"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg></button>
      <button id="fontBtn" class="icon-btn" title="Text size" aria-label="Text size"></button>
      <button id="themeBtn" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
    </div>
  </header>

  <main id="app" class="course-app">
    <div id="status" class="status"><div class="spinner"></div>Loading…</div>

    <section class="course-section" id="issueSection" hidden>
      <p class="session-subtitle muted">
        <a id="courseLink" href="course.html">Course</a>
        <span aria-hidden="true"> &middot; </span>
        <a id="sessionLink" href="session.html">Session</a>
      </p>
      <!-- The issue type's own heading -- the page's real subject, moved out
           of the topbar (see #issueSessionTitle above) so a long title has
           room to wrap without also carrying the print/font/theme buttons.
           h2, not h1: the topbar's h1 stays the page's one true heading
           (see the .topbar .topbar-brand comment in styles.css), so this
           nests under it the same way course.html's own h2 section
           headings do. -->
      <h2 id="issueTitle">Issue Type</h2>

      <!-- Top and bottom are the SAME pager, generated by one pagerHtml() in
           issue.js and injected into these two empty slots, so there is
           exactly one nav design on this page rather than a distinct
           compact one up here. Both keep the `issue-nav` class so the
           existing print rule (hide all page navigation on paper) matches
           without being duplicated. -->
      <nav class="issue-nav issue-pager issue-pager--top" id="issuePagerTop" aria-label="Other issue types" hidden></nav>

      <p id="issueSummary" class="muted" hidden></p>

      <!-- The way into this session's derived multiple-choice round. A real
           button rather than a breadcrumb link, and placed directly above
           the notes: this is the page you are on while studying, so the
           offer to be tested on it belongs where you are reading. -->
      <a id="quizLink" class="quiz-cta" href="quiz.html">
        <span class="quiz-cta-icon" aria-hidden="true">&#127891;</span>
        <span class="quiz-cta-text">Test yourself on this session</span>
        <span class="quiz-cta-arrow" aria-hidden="true">&#8594;</span>
      </a>

      <div id="issueBody" class="session-detail-body detail-content"></div>

      <nav class="issue-nav issue-pager issue-pager--bottom" id="issuePagerBottom" aria-label="Other issue types" hidden></nav>
    </section>
  </main>

  <footer class="footer">
    <span id="syncStatus">—</span>
  </footer>

  <script src="issue.js"></script>
</body>
</html>
