<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue Type — Whack the PCLL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%231e3a5f'/><g transform='translate(1.9 1.9) scale(0.84)' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M5 19 12.5 11.5'/><rect x='9' y='8' width='10' height='4.2' rx='1.2' transform='rotate(45 14 10.1)'/></g></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="styles.css" />
  <script src="common-core.js"></script>
  <script src="common-content.js"></script>
  <script src="common-session.js"></script>
  <script src="courseDetails/PCLL8010.js"></script>
  <script src="courseDetails/PCLL8020.js"></script>
  <script src="courseDetails/PCLL8030.js"></script>
  <script src="courseDetails/PCLL8050.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <a id="backLink" href="session.html" class="icon-btn back-link" aria-label="Back to session"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <h1 id="issueTitle">Issue Type</h1>
    </div>
    <span class="topbar-brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="brand-hammer"><path d="M5 19 12.5 11.5"/><rect x="9" y="8" width="10" height="4.2" rx="1.2" transform="rotate(45 14 10.1)"/></g><g class="brand-spark" stroke-width="1.5"><path d="M20.4 14.9 21.7 13.5"/><path d="M21.5 17.7 23.3 17.6"/><path d="M20.6 20.4 21.9 21.8"/></g></svg><span class="brand-text">Whack the PCLL</span></span>
    <div class="topbar-controls">
      <button id="printBtn" class="icon-btn" title="Print or save these notes as PDF" aria-label="Print or save these notes as PDF"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg></button>
      <button id="fontBtn" class="icon-btn" title="Text size" aria-label="Text size"></button>
      <button id="themeBtn" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
    </div>
  </header>

  <main id="app" class="course-app">
    <div id="status" class="status"><div class="spinner"></div>Loading…</div>

    <section class="course-section" id="issueSection" hidden>
      <div class="issue-topline">
        <p class="session-subtitle muted">
          <a id="courseLink" href="course.html">Course</a>
          <span aria-hidden="true"> &middot; </span>
          <a id="sessionLink" href="session.html">Session</a>
        </p>
        <!-- Icon-only prev/next plus a position count, so moving to an
             adjacent issue type never requires scrolling to the bottom nav
             first -- the two navs share one renderNav() in issue.js and can
             never disagree about what's next. -->
        <nav class="issue-quicknav" id="issueQuicknav" aria-label="Adjacent issue types" hidden>
          <a id="issueQuickPrev" class="issue-quicknav-btn" href="#" hidden aria-label="Previous issue type">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </a>
          <span class="issue-quicknav-pos" id="issueQuickPos"></span>
          <a id="issueQuickNext" class="issue-quicknav-btn" href="#" hidden aria-label="Next issue type">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </a>
        </nav>
      </div>
      <p id="issueSummary" class="muted" hidden></p>
      <div id="issueBody" class="session-detail-body detail-content"></div>

      <!-- Bottom pager: full prev/next cards (title, not just an arrow), plus
           a meta row with the "all issue types" link, the same position
           count as the top quicknav, and a way back up without re-scrolling
           past a long flowchart. Class list keeps `issue-nav` so the
           existing print rule (hide all page navigation on paper) still
           matches without change. -->
      <nav class="issue-nav issue-pager" id="issueNav" aria-label="Other issue types" hidden>
        <div class="issue-pager-row">
          <a id="issuePrev" class="issue-pager-card issue-pager-card--prev" href="#" hidden>
            <span class="issue-pager-arrow" aria-hidden="true">&#8592;</span>
            <span class="issue-pager-copy">
              <span class="issue-pager-kicker">Previous</span>
              <span class="issue-pager-title" id="issuePrevTitle"></span>
            </span>
          </a>
          <a id="issueNext" class="issue-pager-card issue-pager-card--next" href="#" hidden>
            <span class="issue-pager-copy">
              <span class="issue-pager-kicker">Next</span>
              <span class="issue-pager-title" id="issueNextTitle"></span>
            </span>
            <span class="issue-pager-arrow" aria-hidden="true">&#8594;</span>
          </a>
        </div>
        <div class="issue-pager-meta">
          <a id="issueUp" class="issue-pager-all" href="#">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            All issue types
          </a>
          <span class="issue-pager-pos" id="issuePagerPos"></span>
          <button type="button" id="issueBackTop" class="issue-backtop">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M5 13l7-7 7 7"/></svg>
            Back to top
          </button>
        </div>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <span id="syncStatus">—</span>
  </footer>

  <script src="issue.js"></script>
</body>
</html>
