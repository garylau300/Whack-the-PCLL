<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the navy topbar run under the status bar when
       this is opened from the Home Screen; .topbar pads itself back down
       with env(safe-area-inset-top), which is 0 in an ordinary browser. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quiz &amp; Flashcards — Whack the PCLL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%231e3a5f'/><g transform='translate(1.9 1.9) scale(0.84)' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M5 19 12.5 11.5'/><rect x='9' y='8' width='10' height='4.2' rx='1.2' transform='rotate(45 14 10.1)'/></g></svg>" />
  <!-- Quire Sans is self-hosted (fonts/*.woff2, see the @font-face block at
       the top of styles.css) -- preloading the Regular weight, the one
       every page uses for body text, gets it fetching in parallel with the
       stylesheet instead of waiting to be discovered inside it. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/QuireSans.woff2" crossorigin />
  <!-- Installable from the Home Screen. This is not decoration: Safari
       deletes all script-writable storage -- including the flowchart ticks --
       after seven days without opening the site, and a web app added to the
       Home Screen is exempt from that rule. Revision happens in bursts, so
       the seven days is easy to hit.
       iOS ignores the manifest's icons in favour of apple-touch-icon, which
       must be a PNG with no transparency (iOS paints transparency black). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Whack PCLL" />
  <link rel="stylesheet" href="styles.css" />
  <script src="common-core.js"></script>
  <script src="common-content.js"></script>
  <script src="common-session.js"></script>
  <!-- Course metadata and deadlines only (826 bytes gzipped). The notes
       themselves are fetched by the pages that show them, for the one
       course they show -- see loadCourseDetails in common-core.js.
       Generated: npm run build:index. -->
  <script src="courseIndex.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <a id="backLink" href="session.html" class="icon-btn back-link" aria-label="Back to session"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <h1 id="quizTitle">Quiz &amp; Flashcards</h1>
    </div>
    <span class="topbar-brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="brand-hammer"><path d="M5 19 12.5 11.5"/><rect x="9" y="8" width="10" height="4.2" rx="1.2" transform="rotate(45 14 10.1)"/></g><g class="brand-spark" stroke-width="1.5"><path d="M20.4 14.9 21.7 13.5"/><path d="M21.5 17.7 23.3 17.6"/><path d="M20.6 20.4 21.9 21.8"/></g></svg><span class="brand-text">Whack the PCLL</span></span>
    <div class="topbar-controls">
      <button id="fontBtn" class="icon-btn" title="Text size" aria-label="Text size"></button>
      <button id="themeBtn" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
    </div>
  </header>

  <main id="app" class="course-app">
    <div id="status" class="status"><div class="spinner"></div>Loading…</div>

    <section class="course-section" id="quizSection" hidden>
      <p class="session-subtitle muted">
        <a id="courseLink" href="course.html">Course</a>
      </p>
      <div id="quizBody" class="session-detail-body detail-content"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="syncStatus">—</span>
  </footer>

  <script src="quiz.js"></script>
</body>
</html>
