<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timetable — Whack the PCLL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="styles.css" />
  <script src="common.js"></script>
  <script src="courseDetails.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <a href="index.html" class="icon-btn back-link" aria-label="Back to dashboard"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <h1>Timetable</h1>
    </div>
    <div class="topbar-controls">
      <button id="themeBtn" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <nav class="week-nav" id="weekNav" aria-label="Week selector">
    <button id="prevWeek" class="nav-arrow" aria-label="Previous week">‹</button>
    <div class="week-scroll" id="weekScroll"></div>
    <button id="nextWeek" class="nav-arrow" aria-label="Next week">›</button>
  </nav>

  <div class="view-toolbar">
    <div class="week-range" id="weekRange"></div>
    <div class="view-toggle" role="group" aria-label="View mode">
      <button id="gridViewBtn" class="toggle-btn active">Week</button>
      <button id="dayViewBtn" class="toggle-btn">Day</button>
    </div>
  </div>

  <main id="app">
    <div id="status" class="status"><div class="spinner"></div>Loading timetable…</div>
    <div id="weekGrid" class="week-grid" hidden></div>
    <div id="dayView" class="day-view" hidden>
      <div class="day-view-nav">
        <button id="prevDay" class="nav-arrow" aria-label="Previous day">‹</button>
        <div id="dayViewLabel" class="day-view-label"></div>
        <button id="nextDay" class="nav-arrow" aria-label="Next day">›</button>
      </div>
      <div id="dayViewDeadlines" class="day-deadline-list"></div>
      <div id="dayViewBody" class="day-view-body"></div>
    </div>
  </main>

  <footer class="footer">
    <span id="syncStatus">—</span>
    <button id="refreshBtn" class="link-btn"><svg class="refresh-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Refresh now</button>
  </footer>

  <div id="settingsPanel" class="settings-panel">
    <div class="settings-card">
      <div class="settings-head">
        <h2 id="settingsTitle">Settings</h2>
        <button id="closeSettings" class="icon-btn" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <p class="settings-hint">
        Once you know your 3 electives, tick them here to filter elective sessions down to just yours.
        Everything else (core courses, your small-group sessions) always shows.
      </p>
      <div id="electiveList" class="elective-list"></div>
      <p class="settings-hint small">Saved on this device only.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
