name: CI

# No build step -- this is a zero-build static site. Everything here runs in
# plain Node and needs no browser, which is what keeps it fast enough to run
# on every push. What this catches:
#   * a JS syntax error, and the bugs ESLint's default rules flag (undeclared
#     globals, stray `var`, an unused variable);
#   * the cross-file invariants nothing else can see -- a note section that
#     will silently not render, a crossRef pointing at a renamed issue id, two
#     flowchart rows that would share one checkbox, a page missing a course's
#     <script>, a DOM id a script reaches for that the page never declares,
#     and the timetable parser's own behaviour;
#   * stylesheet rules that only bite in one mode -- unbalanced braces, a
#     reduced-motion block that forgets to reset delays, a looping animation
#     that ends mid-motion (see npm test).
# Each of these has actually broken something in this repo's history.
#
# Still not covered: anything that needs a real browser (layout, contrast,
# print rendering). Those stay manual Playwright passes -- see CLAUDE.md's
# verification workflow.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax-check every tracked .js file
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Verify data, page wiring, parser and styles
        run: npm test
